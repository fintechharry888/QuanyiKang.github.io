# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
title                    : "亢泉乂 | Quanyi Kang"
title_separator          : "-"
name                     : &name "Quanyi Kang"
description              : &description "亢泉乂（Quanyi Kang），西南财经大学—电子科技大学高层次人才联合培养项目金融科技专业博士研究生。研究方向包括人工智能与资产定价、金融风险管理、监管科技、多模态金融及跨境资本流动。Quanyi Kang is a Financial Technology Ph.D. student at SWUFE and UESTC."
url                      : "https://fintechharry888.github.io"
baseurl                  : "/QuanyiKang.github.io" # project-site repository under fintechharry888
repository               : "fintechharry888/QuanyiKang.github.io"

seo_home_title           : "亢泉乂（Quanyi Kang）｜西南财经大学金融科技博士生｜SWUFE"

# Page descriptions used for search results and social previews.
seo_descriptions:
  "/": *description
  "/research/": "亢泉乂（Quanyi Kang）学术研究：Transformer、股票Beta预测、人工智能与资产定价、金融风险管理。Research in AI and asset pricing."
  "/teaching/": "亢泉乂（Quanyi Kang）在西南财经大学的教学与助教经历。Teaching at SWUFE."
  "/presentation/": "亢泉乂（Quanyi Kang）参加的金融系统工程、金融学与管理科学学术会议及报告。Academic conference presentations."
  "/contact/": "联系亢泉乂（Quanyi Kang），西南财经大学金融科技博士研究生。Contact for academic collaboration."
og_image                 : "profile.jpg"
social:
  type: Person
  name             : "Quanyi Kang (亢泉乂)"
  links:
    - "https://github.com/fintechharry888"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  avatar           : "profile.jpg"
  name             : "Quanyi Kang"
  bio              : "Ph.D. Student in Financial Technology"
  location         : "Chengdu, China"
  employer         : "SWUFE · UESTC Joint Ph.D. Training Program"
  email            : "775180797@qq.com"
  cv               :
  github           : "fintechharry888"

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : false
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide                   : true      # no public blog posts; omit an empty feed link
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Analytics
analytics:
  provider               :  "false" # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - CONTRIBUTING.md
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - lectures
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  research:
    output: false
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  research_data:
    output: true
    permalink: /:collection/:path/
  presentation:
    output: true
    permalink: /:collection/:path/



# Defaults
defaults:
  # Keep the Google ownership-verification file accessible while excluding it from the public page sitemap.
  - scope:
      path: "googlefb7484ec50ac4984.html"
    values:
      sitemap: false
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _research
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _presentation
  - scope:
      path: ""
      type: presentation
    values:
      layout: single
      author_profile: true
      share: true
      comments: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Asia/Shanghai


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
